# Sobe o banco PostgreSQL e (opcionalmente) a aplicação.
#   Só o banco (para rodar a API pelo IntelliJ):  docker compose up -d db
#   Banco + aplicação:                            docker compose up --build
# Portas podem ser trocadas se estiverem ocupadas: DB_PORT=5433 APP_PORT=8081 docker compose up ...
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts .sql desta pasta rodam apenas na primeira criação do volume
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurante"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/restaurante
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
